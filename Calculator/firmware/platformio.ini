; ============================================================================
;  AI Calculator -- PlatformIO project
;  Target: ESP32-C3 (Arduino framework), 1.54" 128x64 I2C OLED, Casio FX-300MS
;          keypad matrix via TCA8418 (or direct GPIO), DeepSeek streaming chat.
;
;  Common tasks:
;     pio run                     -> build the ESP32-C3 firmware
;     pio run -t upload           -> flash
;     pio device monitor          -> serial console (115200)
;     pio test -e native          -> run the pure-C++ calculator unit tests
; ============================================================================

[platformio]
default_envs = esp32-c3-devkitm-1

; ---------------------------------------------------------------------------
;  Firmware environment (real hardware)
; ---------------------------------------------------------------------------
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; 3 MiB application slot: TLS + WiFi + U8g2 + ArduinoJson need the headroom.
board_build.partitions = partitions.csv

; Board core debug level (2 = warnings + errors) and a roomier loop stack.
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    -Isrc

lib_deps =
    olikraus/U8g2@^2.35.19
    bblanchon/ArduinoJson@^7.0.4

; Uncomment when you enable TLS_MODE_BUNDLE in include/config.h. The bundle is
; generated with ESP-IDF's gen_crt_bundle.py (see README.md, "TLS modes").
; board_build.embed_files = data/cert/x509_crt_bundle.bin

; ---------------------------------------------------------------------------
;  Native environment: host-side unit tests for the pure-C++ calculator.
;  Only src/calc/ is compiled, so no Arduino headers are required.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Iinclude
    -Isrc
    -DUNITY_INCLUDE_DOUBLE
build_src_filter =
    +<calc/>
test_build_src = yes
